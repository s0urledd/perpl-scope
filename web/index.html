<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PerplScope</title>
  <meta name="description" content="Real-time analytics and risk for the Perpl perpetuals exchange on Monad: protocol metrics, markets, liquidations and wallet profiles, computed from chain data.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/vendor/fonts/geist.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
  <script src="/vendor/echarts.min.js" defer></script>
  <script src="/js/app.js" type="module"></script>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="#/" aria-label="PerplScope home">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="11" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="16" cy="16" r="4" fill="currentColor"/><path d="M24 24l5 5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        <span class="brand-name">Perpl<span>Scope</span></span>
      </a>
      <nav class="nav" aria-label="Sections">
        <a href="#/" data-nav="overview">Overview</a>
        <a href="#/markets" data-nav="markets">Markets</a>
        <a href="#/traders" data-nav="traders">Traders</a>
        <a href="#/liquidations" data-nav="liquidations">Liquidations</a>
        <a href="#/risk" data-nav="risk">Risk</a>
        <a href="#/watchlist" data-nav="watchlist">Watchlist</a>
      </nav>
      <div class="search" role="search">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M13.5 13.5L17 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="Search address or account ID" autocomplete="off" spellcheck="false" aria-label="Search wallet by address or account ID">
        <kbd>/</kbd>
        <div id="search-results" class="search-results" hidden></div>
      </div>
      <a class="live" id="live" href="#/status" title="Data pipeline status">
        <span class="dot"></span><span id="live-text">Connecting…</span>
      </a>
    </div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <main id="view" class="view" tabindex="-1"></main>
  <footer class="foot">
    <div class="foot-inner">
      <span>Unofficial analytics. Not affiliated with or endorsed by Perpl or the Monad Foundation.</span>
      <span>Data from Monad chain state and exchange events · <a href="#/status">Methodology &amp; data status</a></span>
    </div>
  </footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
